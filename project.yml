name: Yapper
# Code-signing identity/team live in project-local.yml (gitignored, optional).
# Without it, Xcode falls back to automatic "Sign to Run Locally" signing.
include:
  - path: project-local.yml
    optional: true
options:
  bundleIdPrefix: app.yapper
  deploymentTarget:
    # 13.3: llama.cpp's framework (Voice In formatting) is built for it.
    macOS: "13.3"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    # Universal binary: reach Intel Macs as well as Apple Silicon.
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    # Debug builds only the active arch for speed; Release archives ship
    # a universal (arm64 + x86_64) binary.
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
  # Local speech-to-text for Voice In (hold the talk key to talk). CoreML, on-device, no network
  # once the model is downloaded. Pinned exact: the 1.x line renamed the package and moved APIs.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.18.0"
  # On-device formatting for Voice In (lists, "no wait, I mean" fixes). Local package wrapping
  # llama.cpp's official xcframework; see Vendor/LlamaCpp/Package.swift.
  LlamaCpp:
    path: Vendor/LlamaCpp
schemes:
  Yapper:
    build:
      targets:
        Yapper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YapperTests
targets:
  Yapper:
    type: application
    platform: macOS
    sources:
      - path: Yapper
      # Loaded by /usr/bin/perl to reach MediaRemote (pause other media while the user talks).
      - path: Vendor/MediaRemoteAdapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    resources:
      - path: Yapper/Resources
        optional: true
    info:
      path: Yapper/Info.plist
      properties:
        CFBundleDisplayName: Yapper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: YES
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSAccessibilityUsageDescription: "Yapper reads AI responses from the focused window so it can speak them aloud."
        NSAppleEventsUsageDescription: "Yapper inspects the focused window to find the latest AI response."
        NSMicrophoneUsageDescription: "Yapper listens while you hold your talk key so it can type what you say. Speech is transcribed on this Mac and never uploaded."
        NSHumanReadableCopyright: "Copyright © 2026 KeepCo. All rights reserved."
        # Sparkle auto-updates: feed lives in the repo so the URL never moves.
        SUFeedURL: https://raw.githubusercontent.com/Chefy3x/Yapper/main/site/appcast.xml
        SUPublicEDKey: Jj6vPCQLIQ/YNSDVq7T2bu/mgpfyWoy57hcpTbKFz5g=
    dependencies:
      - package: Sparkle
      - package: WhisperKit
      - package: LlamaCpp
      # Embedded, never linked: only the Perl helper process loads it.
      - target: MediaRemoteAdapter
        embed: true
        link: false
    entitlements:
      path: Yapper/Yapper.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        # Hardened runtime blocks microphone access without this.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yapper.Yapper
        PRODUCT_NAME: Yapper
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Vendored BSD-3 mediaremote-adapter (see Vendor/MediaRemoteAdapter/VENDORED.md). Since macOS
  # 15.4 only Apple-signed processes may use MediaRemote; /usr/bin/perl is one, and it loads this
  # framework to read Now Playing and send pause/play. Symbols must stay visible for the script.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/MediaRemoteAdapter/src
        excludes:
          - "test/*.m"
      - path: Vendor/MediaRemoteAdapter/include
        headerVisibility: public
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: app.yapper.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        OTHER_CFLAGS: ["-fvisibility=default"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/MediaRemoteAdapter/src", "$(SRCROOT)/Vendor/MediaRemoteAdapter/include"]
        OTHER_LDFLAGS: ["-framework", "Foundation", "-framework", "AppKit", "-framework", "UniformTypeIdentifiers"]
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
  # Standalone logic tests: compiles the app sources (minus @main) into the test bundle instead
  # of test-hosting Yapper.app — so running tests never launches the app, installs its event tap,
  # or triggers permission prompts.
  YapperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: YapperTests
      - path: Yapper
        excludes:
          - "YapperApp.swift"
          - "Info.plist"
          - "Yapper.entitlements"
          - "Resources/**"
    dependencies:
      # App sources reference Sparkle (UpdaterService), so the test bundle links it too.
      - package: Sparkle
      - package: WhisperKit
      - package: LlamaCpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yapper.YapperTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
