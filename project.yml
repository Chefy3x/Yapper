name: Yapper
# Code-signing identity/team live in project-local.yml (gitignored, optional).
# Without it, Xcode falls back to automatic "Sign to Run Locally" signing.
include:
  - path: project-local.yml
    optional: true
options:
  bundleIdPrefix: app.yapper
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Universal binary: reach Intel Macs as well as Apple Silicon.
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    # Debug builds only the active arch for speed; Release archives ship
    # a universal (arm64 + x86_64) binary.
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
  # Local speech-to-text for Voice In (hold the talk key to talk). CoreML, on-device, no network
  # once the model is downloaded. Pinned exact: the 1.x line renamed the package and moved APIs.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.18.0"
schemes:
  Yapper:
    build:
      targets:
        Yapper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YapperTests
targets:
  Yapper:
    type: application
    platform: macOS
    sources:
      - path: Yapper
    resources:
      - path: Yapper/Resources
        optional: true
    info:
      path: Yapper/Info.plist
      properties:
        CFBundleDisplayName: Yapper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: YES
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSAccessibilityUsageDescription: "Yapper reads AI responses from the focused window so it can speak them aloud."
        NSAppleEventsUsageDescription: "Yapper inspects the focused window to find the latest AI response."
        NSMicrophoneUsageDescription: "Yapper listens while you hold your talk key so it can type what you say. Speech is transcribed on this Mac and never uploaded."
        NSHumanReadableCopyright: "Copyright © 2026 KeepCo. All rights reserved."
        # Sparkle auto-updates: feed lives in the repo so the URL never moves.
        SUFeedURL: https://raw.githubusercontent.com/Chefy3x/Yapper/main/site/appcast.xml
        SUPublicEDKey: Jj6vPCQLIQ/YNSDVq7T2bu/mgpfyWoy57hcpTbKFz5g=
    dependencies:
      - package: Sparkle
      - package: WhisperKit
    entitlements:
      path: Yapper/Yapper.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        # Hardened runtime blocks microphone access without this.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yapper.Yapper
        PRODUCT_NAME: Yapper
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Standalone logic tests: compiles the app sources (minus @main) into the test bundle instead
  # of test-hosting Yapper.app — so running tests never launches the app, installs its event tap,
  # or triggers permission prompts.
  YapperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: YapperTests
      - path: Yapper
        excludes:
          - "YapperApp.swift"
          - "Info.plist"
          - "Yapper.entitlements"
          - "Resources/**"
    dependencies:
      # App sources reference Sparkle (UpdaterService), so the test bundle links it too.
      - package: Sparkle
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yapper.YapperTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
